services:
  postgres:
    image: postgres:17-alpine
    container_name: deadline-note-postgres
    environment:
      POSTGRES_DB: job_deadline
      POSTGRES_USER: job_app
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_app -d job_deadline"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - deadline-note-data:/var/lib/postgresql/data

volumes:
  deadline-note-data:
