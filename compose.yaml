services:
  postgres:
    image: postgres:17-alpine
    container_name: deadline-note-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-job_deadline}
      POSTGRES_USER: ${DATABASE_USERNAME:-job_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - deadline-note-data:/var/lib/postgresql/data

  api:
    build: .
    container_name: deadline-note-api
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-job_deadline}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-job_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local_password}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  user-web:
    build:
      context: ../deadline-note-user-web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_USER_EMAIL: ${USER_EMAIL:?Set USER_EMAIL in .env}
    container_name: deadline-note-user-web
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin-web:
    build:
      context: ../deadline-note-admin-web
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
    container_name: deadline-note-admin-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  deadline-note-data:
